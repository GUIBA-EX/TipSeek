<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">TipSeek fragment-aware UCE recovery</title>
  <desc id="desc">Four linked stages preserve fragment evidence from hierarchical recruitment through evidence budgeting and dual-graph assembly to reversible rescue.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0077BB"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#526077}
      .stage{font-size:20px;font-weight:700;fill:#fff}.tag{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#526077}
      .body{font-size:17px}.small{font-size:14px;fill:#526077}.strong{font-size:17px;font-weight:700}.num{font-size:20px;font-weight:700;fill:#fff}
      .module{fill:#fff;stroke:#cbd5e1;stroke-width:2}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .evidence{fill:none;stroke:#0077BB;stroke-width:4;marker-end:url(#arrowBlue)}.rollback{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="780" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="title">TipSeek propagates fragment evidence across the recovery workflow</text>
  <text x="800" y="77" text-anchor="middle" class="subtitle">Locus assignment, mate linkage, orientation, reference position, and terminal overhang remain traceable</text>

  <rect x="55" y="120" width="340" height="505" rx="14" class="module"/>
  <path d="M69 120H381A14 14 0 0 1 395 134V188H55V134A14 14 0 0 1 69 120Z" fill="#0077BB"/>
  <circle cx="86" cy="154" r="19" fill="#fff" opacity=".22"/><text x="86" y="161" text-anchor="middle" class="num">1</text>
  <text x="115" y="161" class="stage">Hierarchical recruitment</text>
  <text x="225" y="217" text-anchor="middle" class="tag">LOCUS-RESTRICTED SENSITIVITY</text>
  <g transform="translate(91 251)">
    <line x1="0" y1="8" x2="68" y2="8" stroke="#0077BB" stroke-width="7" stroke-linecap="round"/><line x1="42" y1="30" x2="110" y2="30" stroke="#33BBEE" stroke-width="7" stroke-linecap="round"/>
    <line x1="142" y1="8" x2="210" y2="8" stroke="#0077BB" stroke-width="7" stroke-linecap="round"/><line x1="184" y1="30" x2="252" y2="30" stroke="#33BBEE" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="225" y="314" text-anchor="middle" class="small">paired reads stored once per fragment</text>
  <rect x="90" y="344" width="270" height="62" rx="9" class="box"/><text x="225" y="371" text-anchor="middle" class="strong">Fast pass</text><text x="225" y="394" text-anchor="middle" class="small">full probe panel</text>
  <path d="M225 407V442" class="flow"/>
  <rect x="90" y="444" width="270" height="72" rx="9" fill="#e7f6fc" stroke="#33BBEE" stroke-width="1.5"/>
  <text x="225" y="473" text-anchor="middle" class="strong">Unresolved-only fallback</text><text x="225" y="498" text-anchor="middle" class="small">then full-panel reassignment</text>
  <rect x="106" y="551" width="238" height="38" rx="19" fill="#fff" stroke="#0077BB" stroke-width="1.7"/><text x="225" y="576" text-anchor="middle" class="strong" fill="#0077BB">selected fragments</text>

  <rect x="440" y="120" width="340" height="505" rx="14" class="module"/>
  <path d="M454 120H766A14 14 0 0 1 780 134V188H440V134A14 14 0 0 1 454 120Z" fill="#009988"/>
  <circle cx="471" cy="154" r="19" fill="#fff" opacity=".22"/><text x="471" y="161" text-anchor="middle" class="num">2</text>
  <text x="500" y="161" class="stage">Evidence budgeting</text>
  <text x="610" y="217" text-anchor="middle" class="tag">DEPTH-AWARE RETENTION</text>
  <rect x="475" y="254" width="132" height="150" rx="10" fill="#e9f8f5" stroke="#009988" stroke-width="1.5"/>
  <text x="541" y="286" text-anchor="middle" class="strong">Core</text><text x="541" y="313" text-anchor="middle" class="small">coverage-aware</text><text x="541" y="335" text-anchor="middle" class="small">compression</text>
  <text x="541" y="372" text-anchor="middle" class="body">N<tspan baseline-shift="sub" font-size="12">core</tspan> + 64 bins</text>
  <rect x="627" y="254" width="118" height="150" rx="10" fill="#e7f6fc" stroke="#33BBEE" stroke-width="1.5"/>
  <text x="686" y="286" text-anchor="middle" class="strong">Terminal</text><text x="686" y="313" text-anchor="middle" class="small">left/right</text><text x="686" y="335" text-anchor="middle" class="small">overhang ladders</text>
  <text x="686" y="372" text-anchor="middle" class="body">sparse bridges</text>
  <path d="M541 405V445M686 405V445M541 445H686" fill="none" stroke="#334155" stroke-width="2.5"/>
  <path d="M613 445V468" class="flow"/>
  <rect x="488" y="470" width="245" height="62" rx="9" class="box"/><text x="610" y="497" text-anchor="middle" class="strong">Merge by fragment ID</text><text x="610" y="519" text-anchor="middle" class="small">core + flank evidence</text>
  <rect x="493" y="551" width="234" height="38" rx="19" fill="#fff" stroke="#009988" stroke-width="1.7"/><text x="610" y="576" text-anchor="middle" class="strong" fill="#0077BB">budgeted fragments</text>

  <rect x="825" y="120" width="340" height="505" rx="14" class="module"/>
  <path d="M839 120H1151A14 14 0 0 1 1165 134V188H825V134A14 14 0 0 1 839 120Z" fill="#0077BB"/>
  <circle cx="856" cy="154" r="19" fill="#fff" opacity=".22"/><text x="856" y="161" text-anchor="middle" class="num">3</text>
  <text x="885" y="161" class="stage">Dual-graph assembly</text>
  <text x="995" y="217" text-anchor="middle" class="tag">BRANCH-SUPPORTED PATHS</text>
  <rect x="860" y="254" width="270" height="72" rx="9" class="box"/><text x="995" y="283" text-anchor="middle" class="strong">Core graph</text><text x="995" y="307" text-anchor="middle" class="small">depth + reference evidence</text>
  <rect x="860" y="352" width="270" height="84" rx="9" fill="#e7f6fc" stroke="#33BBEE" stroke-width="1.5"/>
  <text x="995" y="382" text-anchor="middle" class="strong">PE-assisted graph</text><text x="995" y="406" text-anchor="middle" class="small">independent fragments support</text><text x="995" y="426" text-anchor="middle" class="small">low-depth non-reference branches</text>
  <path d="M995 327V349" class="flow"/><path d="M995 437V468" class="flow"/>
  <rect x="865" y="470" width="260" height="62" rx="9" class="box"/><text x="995" y="497" text-anchor="middle" class="strong">Compare candidates</text><text x="995" y="519" text-anchor="middle" class="small">retain the best supported path</text>
  <rect x="880" y="551" width="230" height="38" rx="19" fill="#fff" stroke="#0077BB" stroke-width="1.7"/><text x="995" y="576" text-anchor="middle" class="strong" fill="#0077BB">accepted core</text>

  <rect x="1210" y="120" width="340" height="505" rx="14" class="module"/>
  <path d="M1224 120H1536A14 14 0 0 1 1550 134V188H1210V134A14 14 0 0 1 1224 120Z" fill="#EE7733"/>
  <circle cx="1241" cy="154" r="19" fill="#fff" opacity=".22"/><text x="1241" y="161" text-anchor="middle" class="num">4</text>
  <text x="1270" y="161" class="stage">Reversible rescue</text>
  <text x="1380" y="217" text-anchor="middle" class="tag">LOCUS-LEVEL REVERSIBILITY</text>
  <rect x="1245" y="252" width="270" height="65" rx="9" class="box"/><text x="1380" y="280" text-anchor="middle" class="strong">Re-recruit from core + probe</text><text x="1380" y="303" text-anchor="middle" class="small">evaluate each locus independently</text>
  <path d="M1380 318V345" class="flow"/>
  <path d="M1380 345L1425 385L1380 425L1335 385Z" fill="#fff7ed" stroke="#EE7733" stroke-width="1.8"/><text x="1380" y="390" text-anchor="middle" class="strong">gate</text>
  <path d="M1335 385H1285V456" class="flow"/><path d="M1425 385H1475V456" class="flow"/><path d="M1380 425V456" class="flow"/>
  <rect x="1232" y="458" width="102" height="50" rx="8" fill="#e9f8f5" stroke="#009988"/><text x="1283" y="489" text-anchor="middle" class="body">accept</text>
  <rect x="1340" y="458" width="80" height="50" rx="8" fill="#fff7ed" stroke="#EE7733"/><text x="1380" y="489" text-anchor="middle" class="body">trim</text>
  <rect x="1426" y="458" width="102" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="1477" y="489" text-anchor="middle" class="body">revert</text>
  <rect x="1254" y="551" width="252" height="38" rx="19" fill="#fff" stroke="#EE7733" stroke-width="1.7"/><text x="1380" y="576" text-anchor="middle" class="strong" fill="#0077BB">accepted UCE candidate</text>
  <path d="M1477 509V535C1477 610 1380 610 1380 591" class="rollback"/>

  <path d="M395 570H437M780 570H822M1165 570H1207" class="evidence"/>
  <rect x="55" y="662" width="1495" height="62" rx="12" fill="#eef7fb" stroke="#0077BB" stroke-width="1.7"/>
  <text x="225" y="688" text-anchor="middle" class="small">recruitment evidence</text><text x="610" y="688" text-anchor="middle" class="small">retention evidence</text><text x="995" y="688" text-anchor="middle" class="small">path evidence</text><text x="1380" y="688" text-anchor="middle" class="small">acceptance evidence</text>
  <path d="M225 704H1380" stroke="#0077BB" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="800" y="753" text-anchor="middle" class="strong" fill="#0077BB">One fragment-level evidence record links recruitment, assembly, extension, and rollback</text>
</svg>
