name: base
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Keep the top-level tools pinned. The immutable container digest records
  # the complete transitive environment used for each published image.
  # ipyrad still imports distutils, which was removed in Python 3.12.
  - python=3.11
  - aster=1.25
  - blast=2.17.0
  - clustalo=1.2.4
  - fasttree=2.2.0
  - iqtree=3.1.3
  - mafft=7.525
  - miniprot=0.18
  - minimap2=2.31
  - raxml-ng=2.0.2
  - trimal=1.5.1
  - veryfasttree=4.0.5
  - minibwa=0.7
  # RAxML-NG 2.0.2 currently requires htslib 1.23.x. Keep samtools and
  # bcftools on the matching release instead of mixing incompatible ABIs.
  - samtools=1.23.1
  - bcftools=1.23.1
  - plink=1.90b6.21
  - ipyrad=0.9.108
  - pigz=2.8
  - julia=1.12.7
  - zlib-ng=2.3.3
